# ============================================================================
# Painel de conteudo da Gio (Decap CMS)
# O campo "repo" abaixo sera preenchido quando criarmos o repositorio no GitHub.
# ============================================================================
backend:
  name: github
  repo: andreconacta/gio9-site
  branch: main

# Idioma do painel
locale: 'pt'

# Onde as fotos enviadas pelo painel sao guardadas
media_folder: "assets/fotos"
public_folder: "assets/fotos"

# Mensagem de commit amigavel
site_url: https://gio9.com
display_url: https://gio9.com

# Editor mais limpo: sem painel de previa a direita
editor:
  preview: false

collections:
  # ---------------- NOTICIAS ----------------
  - name: "noticias"
    label: "Notícias"
    delete: false
    files:
      - name: "noticias"
        label: "Lista de notícias"
        file: "assets/content/news.json"
        description: "A notícia mais nova deve ficar no topo da lista."
        fields:
          - name: "items"
            label: "Notícias"
            label_singular: "Notícia"
            widget: "list"
            add_to_top: true
            collapsed: true
            summary: "{{fields.title.pt}}"
            fields:
              - name: "title"
                label: "Título"
                widget: "object"
                fields:
                  - { name: "pt", label: "Português", widget: "string" }
                  - { name: "en", label: "Inglês (opcional)", widget: "string", required: false }
                  - { name: "es", label: "Espanhol (opcional)", widget: "string", required: false }
              - name: "date"
                label: "Data"
                widget: "object"
                required: false
                fields:
                  - { name: "pt", label: "Português (ex.: Agosto de 2025)", widget: "string", required: false }
                  - { name: "en", label: "Inglês (opcional)", widget: "string", required: false }
                  - { name: "es", label: "Espanhol (opcional)", widget: "string", required: false }
              - name: "tag"
                label: "Categoria/etiqueta"
                widget: "object"
                required: false
                fields:
                  - { name: "pt", label: "Português (ex.: Seleção Brasileira)", widget: "string", required: false }
                  - { name: "en", label: "Inglês (opcional)", widget: "string", required: false }
                  - { name: "es", label: "Espanhol (opcional)", widget: "string", required: false }
              - name: "excerpt"
                label: "Resumo"
                widget: "object"
                required: false
                fields:
                  - { name: "pt", label: "Português", widget: "text", required: false }
                  - { name: "en", label: "Inglês (opcional)", widget: "text", required: false }
                  - { name: "es", label: "Espanhol (opcional)", widget: "text", required: false }
              - { name: "url", label: "Link da matéria (opcional)", widget: "string", required: false }

  # ---------------- GOLS ----------------
  - name: "gols"
    label: "Gols"
    delete: false
    files:
      - name: "gols"
        label: "Lista de gols"
        file: "assets/content/goals.json"
        fields:
          - name: "items"
            label: "Gols"
            label_singular: "Gol"
            widget: "list"
            add_to_top: true
            collapsed: true
            summary: "{{fields.title.pt}}"
            fields:
              - name: "title"
                label: "Título"
                widget: "object"
                fields:
                  - { name: "pt", label: "Português", widget: "string" }
                  - { name: "en", label: "Inglês (opcional)", widget: "string", required: false }
                  - { name: "es", label: "Espanhol (opcional)", widget: "string", required: false }
              - name: "date"
                label: "Data"
                widget: "object"
                required: false
                fields:
                  - { name: "pt", label: "Português (ex.: Ago 2024)", widget: "string", required: false }
                  - { name: "en", label: "Inglês (opcional)", widget: "string", required: false }
                  - { name: "es", label: "Espanhol (opcional)", widget: "string", required: false }
              - name: "cat"
                label: "Categoria"
                widget: "select"
                required: false
                options:
                  - { label: "Brasil", value: "brazil" }
                  - { label: "Atlético", value: "atletico" }
                  - { label: "Madrid CFF", value: "madridcff" }
                  - { label: "Inglaterra", value: "england" }
              - { name: "yt", label: "ID do vídeo no YouTube (opcional, a parte depois de watch?v=)", widget: "string", required: false }
              - { name: "external", label: "Vídeo de terceiros? (marque para abrir no YouTube em vez de tocar no site)", widget: "boolean", default: false, required: false }

  # ---------------- VIDEOS ----------------
  - name: "videos"
    label: "Vídeos"
    delete: false
    files:
      - name: "videos"
        label: "Lista de vídeos"
        file: "assets/content/videos.json"
        fields:
          - name: "items"
            label: "Vídeos"
            label_singular: "Vídeo"
            widget: "list"
            add_to_top: true
            collapsed: true
            summary: "{{fields.title.pt}}"
            fields:
              - name: "title"
                label: "Título"
                widget: "object"
                fields:
                  - { name: "pt", label: "Português", widget: "string" }
                  - { name: "en", label: "Inglês (opcional)", widget: "string", required: false }
                  - { name: "es", label: "Espanhol (opcional)", widget: "string", required: false }
              - name: "tag"
                label: "Etiqueta (ex.: Atlético de Madrid)"
                widget: "object"
                required: false
                fields:
                  - { name: "pt", label: "Português", widget: "string", required: false }
                  - { name: "en", label: "Inglês (opcional)", widget: "string", required: false }
                  - { name: "es", label: "Espanhol (opcional)", widget: "string", required: false }
              - { name: "id", label: "ID do YouTube (a parte depois de watch?v=)", widget: "string" }
              - { name: "external", label: "Vídeo de terceiros? (marque para abrir no YouTube em vez de tocar no site)", widget: "boolean", default: false, required: false }
              - name: "cat"
                label: "Categoria (para filtro na página de Vídeos)"
                widget: "select"
                required: false
                options:
                  - { label: "Gols", value: "gols" }
                  - { label: "Melhores momentos", value: "momentos" }
                  - { label: "Seleção", value: "selecao" }
                  - { label: "Bastidores e campanhas", value: "bastidores" }
                  - { label: "Entrevistas", value: "entrevistas" }

  # ---------------- FOTOS ----------------
  - name: "fotos"
    label: "Fotos"
    delete: false
    files:
      - name: "fotos"
        label: "Galeria de fotos"
        file: "assets/content/photos.json"
        fields:
          - name: "items"
            label: "Fotos"
            label_singular: "Foto"
            widget: "list"
            add_to_top: true
            collapsed: true
            summary: "{{fields.label.pt}}"
            fields:
              - { name: "img", label: "Foto (enviar imagem)", widget: "image" }
              - name: "label"
                label: "Legenda"
                widget: "object"
                required: false
                fields:
                  - { name: "pt", label: "Português", widget: "string", required: false }
                  - { name: "en", label: "Inglês (opcional)", widget: "string", required: false }
                  - { name: "es", label: "Espanhol (opcional)", widget: "string", required: false }
              - name: "cat"
                label: "Categoria"
                widget: "select"
                required: false
                options:
                  - { label: "Atlético", value: "atletico" }
                  - { label: "Brasil", value: "brazil" }
                  - { label: "Ação de jogo", value: "action" }
                  - { label: "Retrato", value: "portrait" }
                  - { label: "Campanha", value: "campaign" }
                  - { label: "Bastidores", value: "behind" }

  # ---------------- CARREIRA / CLUBES ----------------
  - name: "carreira"
    label: "Carreira e clubes"
    delete: false
    files:
      - name: "carreira"
        label: "Clubes (carreira)"
        file: "assets/content/career.json"
        description: "Do clube mais recente para o mais antigo."
        fields:
          - name: "items"
            label: "Clubes"
            label_singular: "Clube"
            widget: "list"
            add_to_top: true
            collapsed: true
            summary: "{{fields.club}}"
            fields:
              - { name: "club", label: "Nome do clube", widget: "string" }
              - name: "years"
                label: "Período"
                widget: "object"
                required: false
                fields:
                  - { name: "pt", label: "Português (ex.: 2024 até hoje)", widget: "string", required: false }
                  - { name: "en", label: "Inglês (opcional)", widget: "string", required: false }
                  - { name: "es", label: "Espanhol (opcional)", widget: "string", required: false }
              - name: "place"
                label: "Local"
                widget: "object"
                required: false
                fields:
                  - { name: "pt", label: "Português (ex.: Madri, Espanha)", widget: "string", required: false }
                  - { name: "en", label: "Inglês (opcional)", widget: "string", required: false }
                  - { name: "es", label: "Espanhol (opcional)", widget: "string", required: false }
              - name: "note"
                label: "Descrição"
                widget: "object"
                required: false
                fields:
                  - { name: "pt", label: "Português", widget: "text", required: false }
                  - { name: "en", label: "Inglês (opcional)", widget: "text", required: false }
                  - { name: "es", label: "Espanhol (opcional)", widget: "text", required: false }
              - { name: "img", label: "Foto do clube (opcional)", widget: "image", required: false }
              - { name: "na_home", label: "Mostrar na página inicial (só clubes de contrato)", widget: "boolean", default: false, required: false }

  # ---------------- TITULOS E PREMIOS ----------------
  - name: "titulos"
    label: "Títulos e prêmios"
    delete: false
    files:
      - name: "titulos"
        label: "Lista de títulos"
        file: "assets/content/honours.json"
        fields:
          - name: "items"
            label: "Títulos"
            label_singular: "Título"
            widget: "list"
            add_to_top: true
            collapsed: true
            summary: "{{fields.t.pt}}"
            fields:
              - { name: "em", label: "Emoji (ex.: trofeu)", widget: "string", required: false }
              - name: "t"
                label: "Título"
                widget: "object"
                fields:
                  - { name: "pt", label: "Português", widget: "string" }
                  - { name: "en", label: "Inglês (opcional)", widget: "string", required: false }
                  - { name: "es", label: "Espanhol (opcional)", widget: "string", required: false }
              - name: "s"
                label: "Detalhe (ex.: Brasil, ano, clube)"
                widget: "object"
                required: false
                fields:
                  - { name: "pt", label: "Português", widget: "string", required: false }
                  - { name: "en", label: "Inglês (opcional)", widget: "string", required: false }
                  - { name: "es", label: "Espanhol (opcional)", widget: "string", required: false }

  # ---------------- PERFIL (SOBRE) ----------------
  - name: "perfil"
    label: "Perfil da jogadora (Sobre)"
    delete: false
    files:
      - name: "perfil"
        label: "Ficha do perfil"
        file: "assets/content/facts.json"
        fields:
          - name: "items"
            label: "Itens do perfil"
            label_singular: "Item"
            widget: "list"
            add_to_top: true
            collapsed: true
            summary: "{{fields.k.pt}}"
            fields:
              - name: "k"
                label: "Campo (ex.: Altura)"
                widget: "object"
                fields:
                  - { name: "pt", label: "Português", widget: "string" }
                  - { name: "en", label: "Inglês (opcional)", widget: "string", required: false }
                  - { name: "es", label: "Espanhol (opcional)", widget: "string", required: false }
              - name: "v"
                label: "Valor (ex.: 167 cm)"
                widget: "object"
                fields:
                  - { name: "pt", label: "Português", widget: "string" }
                  - { name: "en", label: "Inglês (opcional)", widget: "string", required: false }
                  - { name: "es", label: "Espanhol (opcional)", widget: "string", required: false }

  # ---------------- NUMEROS / CONTATO / REDES / PARCEIROS ----------------
  - name: "info"
    label: "Números, contato, redes e parceiros"
    delete: false
    files:
      - name: "info"
        label: "Informações do site"
        file: "assets/content/info.json"
        fields:
          - name: "numbers"
            label: "Números de destaque (início)"
            widget: "list"
            add_to_top: true
            collapsed: true
            required: false
            max: 4
            summary: "{{fields.v}}"
            fields:
              - { name: "v", label: "Número (ex.: 200+)", widget: "string" }
              - { name: "pt", label: "Legenda em português", widget: "string", required: false }
              - { name: "en", label: "Legenda em inglês (opcional)", widget: "string", required: false }
              - { name: "es", label: "Legenda em espanhol (opcional)", widget: "string", required: false }
          - name: "contact"
            label: "Contato e redes"
            widget: "object"
            fields:
              - { name: "email", label: "E-mail geral", widget: "string", required: false }
              - { name: "partnerships", label: "E-mail de parcerias", widget: "string", required: false }
              - { name: "instagram", label: "Instagram (sem @)", widget: "string", required: false }
              - { name: "tiktok", label: "TikTok (sem @)", widget: "string", required: false }
              - { name: "x", label: "X / Twitter (sem @)", widget: "string", required: false }
              - name: "locations"
                label: "Base (ex.: Madri, São Paulo)"
                widget: "object"
                required: false
                fields:
                  - { name: "pt", label: "Português", widget: "string", required: false }
                  - { name: "en", label: "Inglês (opcional)", widget: "string", required: false }
                  - { name: "es", label: "Espanhol (opcional)", widget: "string", required: false }
          - name: "followers"
            label: "Seguidores"
            widget: "object"
            required: false
            fields:
              - { name: "instagram", label: "Instagram (ex.: 564K)", widget: "string", required: false }
              - { name: "tiktok", label: "TikTok (ex.: 829K)", widget: "string", required: false }
              - { name: "x", label: "X (ex.: 200K)", widget: "string", required: false }
              - { name: "combined", label: "Total combinado (ex.: 1.5M+)", widget: "string", required: false }
          - name: "partners"
            label: "Patrocinadores e parceiros"
            widget: "list"
            add_to_top: true
            collapsed: true
            required: false
            summary: "{{fields.name}}"
            fields:
              - { name: "name", label: "Nome (ex.: Nike)", widget: "string" }
              - name: "role"
                label: "Tipo (ex.: Material esportivo)"
                widget: "object"
                required: false
                fields:
                  - { name: "pt", label: "Português", widget: "string", required: false }
                  - { name: "en", label: "Inglês (opcional)", widget: "string", required: false }
                  - { name: "es", label: "Espanhol (opcional)", widget: "string", required: false }

  # ---------------- PAGINA INICIAL (textos e fotos) ----------------
  - name: "inicio"
    label: "Início (textos e fotos)"
    delete: false
    files:
      - name: "inicio"
        label: "Textos e fotos da página inicial"
        file: "assets/content/home.json"
        description: "Para deixar uma palavra em dourado, coloque *asteriscos* em volta dela. Ex.: cruza *fronteiras.*"
        fields:
          - { name: "heroImage", label: "Foto do topo", widget: "image", required: false }
          - { name: "brazilImage", label: "Foto da seção Brasil", widget: "image", required: false }
          - name: "hero_eyebrow"
            label: "Linha acima do título (topo)"
            widget: "object"
            required: false
            fields:
              - { name: "pt", label: "Português", widget: "string", required: false }
              - { name: "en", label: "Inglês (opcional)", widget: "string", required: false }
              - { name: "es", label: "Espanhol (opcional)", widget: "string", required: false }
          - name: "hero_intro"
            label: "Frase de abertura (topo)"
            widget: "object"
            required: false
            fields:
              - { name: "pt", label: "Português", widget: "text", required: false }
              - { name: "en", label: "Inglês (opcional)", widget: "text", required: false }
              - { name: "es", label: "Espanhol (opcional)", widget: "text", required: false }
          - name: "story_h"
            label: "Título da seção 'A história'"
            widget: "object"
            required: false
            fields:
              - { name: "pt", label: "Português", widget: "string", required: false }
              - { name: "en", label: "Inglês (opcional)", widget: "string", required: false }
              - { name: "es", label: "Espanhol (opcional)", widget: "string", required: false }
          - name: "story_p"
            label: "Texto da seção 'A história'"
            widget: "object"
            required: false
            fields:
              - { name: "pt", label: "Português", widget: "text", required: false }
              - { name: "en", label: "Inglês (opcional)", widget: "text", required: false }
              - { name: "es", label: "Espanhol (opcional)", widget: "text", required: false }
          - name: "brazil_h"
            label: "Título da seção 'Brasil'"
            widget: "object"
            required: false
            fields:
              - { name: "pt", label: "Português", widget: "string", required: false }
              - { name: "en", label: "Inglês (opcional)", widget: "string", required: false }
              - { name: "es", label: "Espanhol (opcional)", widget: "string", required: false }
          - name: "brazil_p"
            label: "Texto da seção 'Brasil'"
            widget: "object"
            required: false
            fields:
              - { name: "pt", label: "Português", widget: "text", required: false }
              - { name: "en", label: "Inglês (opcional)", widget: "text", required: false }
              - { name: "es", label: "Espanhol (opcional)", widget: "text", required: false }

  # ---------------- PAGINA SOBRE (textos e foto) ----------------
  - name: "sobre"
    label: "Sobre (textos e foto)"
    delete: false
    files:
      - name: "sobre"
        label: "Textos e foto da página Sobre"
        file: "assets/content/about.json"
        description: "Para deixar uma palavra em dourado, coloque *asteriscos* em volta dela."
        fields:
          - { name: "aboutImage", label: "Foto da página Sobre", widget: "image", required: false }
          - name: "lead"
            label: "Frase de destaque (abertura)"
            widget: "object"
            required: false
            fields:
              - { name: "pt", label: "Português", widget: "text", required: false }
              - { name: "en", label: "Inglês (opcional)", widget: "text", required: false }
              - { name: "es", label: "Espanhol (opcional)", widget: "text", required: false }
          - name: "p1"
            label: "Primeiro parágrafo"
            widget: "object"
            required: false
            fields:
              - { name: "pt", label: "Português", widget: "text", required: false }
              - { name: "en", label: "Inglês (opcional)", widget: "text", required: false }
              - { name: "es", label: "Espanhol (opcional)", widget: "text", required: false }
          - name: "p2"
            label: "Segundo parágrafo"
            widget: "object"
            required: false
            fields:
              - { name: "pt", label: "Português", widget: "text", required: false }
              - { name: "en", label: "Inglês (opcional)", widget: "text", required: false }
              - { name: "es", label: "Espanhol (opcional)", widget: "text", required: false }
